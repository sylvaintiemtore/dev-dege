<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <title>search</title>
    <style> 
      input[type=text] {
        width: 130px;
        box-sizing: border-box;
        border: 2px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
        background-color: white;
        background-image: url('searchicon.png');
        background-position: 10px 10px; 
        background-repeat: no-repeat;
        padding: 12px 20px 12px 40px;
        -webkit-transition: width 0.4s ease-in-out;
        transition: width 0.4s ease-in-out;
      }
      
      input[type=text]:focus {
        width: 100%;
      }
      </style>
  </head>
  <body>
         
    <h1 class="text-center"> Results Page </h1><hr>
      
    <div class="container"> 
      <h2> Search query</h2>
        <form action="{% url 'search' %}">
          <input type="text" name="search" placeholder="search..">
        </form>
      </div>
        <div class="container mt-4"> 
        <h4>Search Query</h4>
        {% if query  %}
          <p class="lead"> search for <strong>{{query}}</strong></p>
        {% endif  %}
        {% if results  %}  
           {% for x in results  %}
          <a href="{{ x.get_absolute_url }}">  <h3> {{ x.title  }}  </h3></a>
          <p   class="lead mt-1" > {{ x.des |  truncatewords:20 }}   </p>
           {%  endfor  %}
        {% endif %}

        {%  if not results %}
            <p> here no results for your {{query}} </p>
        {% endif %}
        </div>
  
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>
    </body>
    </html>
